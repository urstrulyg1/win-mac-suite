name: One-time truth-state patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[truth-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App truth state
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          replacements = {
              "ramGB: 0,\n    freeDiskGB: 0,\n    totalDiskGB: 0,\n    isOnline: true,\n    cpuUsage: 0,\n    memoryUsage: 0,": "ramGB: null,\n    freeDiskGB: null,\n    totalDiskGB: null,\n    isOnline: null,\n    cpuUsage: null,\n    memoryUsage: null,",
              "hostName: (data.hostName as string) || 'Local Computer',": "hostName: typeof data.hostName === 'string' ? data.hostName : '',",
              "user: (data.user as string) || 'User',": "user: typeof data.user === 'string' ? data.user : '',",
              "os: (data.os as string) || 'OS',": "os: typeof data.os === 'string' ? data.os : '',",
              "processor: (data.processor as string) || 'CPU',": "processor: typeof data.processor === 'string' ? data.processor : '',",
              "ramGB: (data.ramGB as number) || 0,": "ramGB: typeof data.ramGB === 'number' ? data.ramGB : null,",
              "freeDiskGB: (data.freeDiskGB as number) || 0,": "freeDiskGB: typeof data.freeDiskGB === 'number' ? data.freeDiskGB : null,",
              "totalDiskGB: (data.totalDiskGB as number) || 0,": "totalDiskGB: typeof data.totalDiskGB === 'number' ? data.totalDiskGB : null,",
              "isOnline: (data.isOnline as boolean) ?? true,": "isOnline: typeof data.isOnline === 'boolean' ? data.isOnline : null,",
              "cpuUsage: (data.cpuUsage as number) ?? 0,": "cpuUsage: typeof data.cpuUsage === 'number' ? data.cpuUsage : null,",
              "memoryUsage: (data.memoryUsage as number) ?? 0,": "memoryUsage: typeof data.memoryUsage === 'number' ? data.memoryUsage : null,",
          }
          for old, new in replacements.items(): s = s.replace(old, new)
          s = s.replace("""    setRealSysInfo((prev) => ({\n      ...prev,\n      freeDiskGB: +(prev.freeDiskGB + (finalSummary.spaceReclaimed / 1024)).toFixed(1),\n    }));\n""", "")
          s = s.replace("""      summary: `Completed ${finalSummary.passedSections} of ${finalSummary.totalSections} phases. Reclaimed ${finalSummary.spaceReclaimed >= 1024 ? `${(finalSummary.spaceReclaimed / 1024).toFixed(1)} GB` : `${finalSummary.spaceReclaimed} MB`} disk space.`,\n""", """      summary: `Completed ${finalSummary.passedSections} of ${finalSummary.totalSections} phases. Disk space reclaimed: ${finalSummary.spaceReclaimed == null ? 'NOT_MEASURED' : finalSummary.spaceReclaimed >= 1024 ? `${(finalSummary.spaceReclaimed / 1024).toFixed(1)} GB` : `${finalSummary.spaceReclaimed} MB`}.`,\n""")
          s = s.replace("""    } else {\n      toast(`${config.productName} completed successfully`, 'success');\n      if (exportJson) {\n""", """    } else if (finalSummary.passedSections === finalSummary.totalSections) {\n      toast(`${config.productName} completed successfully`, 'success');\n      if (exportJson) {\n""")
          s = s.replace("""    }\n\n    setTimeout(() => {\n""", """    } else {\n      toast(`${config.productName} completed with warnings or errors`, 'warning');\n      if (exportJson) {\n        downloadReport(sectionsRef.current, logsRef.current, finalSummary, mode);\n      }\n    }\n\n    setTimeout(() => {\n""", 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m '[truth-patch] Make operation result messaging fail closed'
          git push
