name: Cross-platform native validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-smoke:
    name: Native smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-13, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run regression tests
        run: npm test

      - name: Start native server
        shell: bash
        run: |
          npm run server > native-server.log 2>&1 &
          echo $! > native-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3131/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat native-server.log
          exit 1

      - name: Run native platform smoke test
        shell: bash
        run: node server/tests/native-platform-smoke.js

      - name: Stop native server
        if: always()
        shell: bash
        run: |
          if [ -f native-server.pid ]; then kill "$(cat native-server.pid)" 2>/dev/null || true; fi

      - name: Upload native server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-server-log-${{ matrix.os }}
          path: native-server.log
          if-no-files-found: ignore
