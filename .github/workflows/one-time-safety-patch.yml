name: One-time degraded probe safety patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[safety-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove failure fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/runtime/degraded-mode.js')
          s = p.read_text()
          s = s.replace('value: fallbackValue,', 'value: null,')
          p.write_text(s)
          assert 'value: fallbackValue' not in s
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/runtime/degraded-mode.js
          git diff --cached --quiet && exit 0
          git commit -m '[safety-patch] Remove degraded probe fallback telemetry'
          git push
