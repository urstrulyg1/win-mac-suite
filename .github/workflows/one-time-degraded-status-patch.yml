name: One-time degraded status truth patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[degraded-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unprobed capability availability claims
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/runtime/degraded-mode.js')
          s = p.read_text()
          s = s.replace("available: c.requirement === NETWORK_REQUIREMENT.OFFLINE_SUPPORTED || connectivity.online,", "available: null,")
          s = s.replace("available: connectivity.online,\n      optional: true,\n      status: connectivity.online ? 'AVAILABLE' : 'SKIPPED_OFFLINE',", "available: null,\n      optional: true,\n      status: connectivity.online ? 'NOT_CHECKED' : 'SKIPPED_OFFLINE',")
          p.write_text(s)
          assert "status: connectivity.online ? 'AVAILABLE'" not in s
          assert "available: c.requirement === NETWORK_REQUIREMENT.OFFLINE_SUPPORTED || connectivity.online" not in s
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/runtime/degraded-mode.js
          git diff --cached --quiet && exit 0
          git commit -m '[degraded-patch] Remove unprobed capability availability claims'
          git push
